name: Canvas to Website
on: [push]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Convert .canvas to HTML
        run: |
          set -e
          mkdir -p dist
          npm install unified rehype-parse rehype-jsoncanvas rehype-stringify
          for file in canvases/*.canvas; do
            filename=$(basename "$file")
            filename_no_ext="${filename%.*}"
            node convert.js "$file" "dist/${filename_no_ext}.html"
          done

      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
